# Run ant test on Jython 2.7 (GitHub action)

name: ant test 2.7

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  checks: write
#  id-token: write

jobs:
  # build once
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Full Build with Ant
        run: ant

      # preserve the built files for later
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/

  # run the ci tests
  test:
    needs: build # wait for build to finish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: [11, 17, 21, 25]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      # fetch the previously built files
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/

      - name: Adjust jython Permission
        run: chmod +x dist/bin/jython

      - name: Test with Ant
        run: ant test-ci-built

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java-version }}
          path: reports/junit/raw

      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: 'JUnit Test Report (${{ matrix.os }} - Java ${{ matrix.java-version }})'
          report_paths: '**/TEST-*.xml'

        